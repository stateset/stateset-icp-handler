[package]
name = "stateset-icp-handler"
version = "0.4.2"
edition = "2021"
# Matches the pinned stateset-icommerce engine release. Bumps require a
# CHANGELOG entry.
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Reference implementation of the Intelligent Commerce Protocol (ICP), backed by the StateSet iCommerce engine"
repository = "https://github.com/stateset/stateset-icp-handler"
readme = "README.md"
keywords = ["icp", "intelligent-commerce", "agentic", "commerce", "stateset"]
categories = ["web-programming::http-server", "api-bindings"]

# Standalone package (not part of a parent workspace)
[workspace]

[[bin]]
name = "stateset-icp-handler"
path = "src/main.rs"

[[bin]]
name = "icp-conformance"
path = "src/bin/icp_conformance.rs"

[[bin]]
name = "icp-mcp-stdio"
path = "src/bin/icp_mcp_stdio.rs"

[dependencies]
# Async runtime + web
tokio = { version = "1", features = ["full", "sync", "rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4" }
tower-http = { version = "0.5", features = ["cors", "compression-full", "trace", "limit"] }
http = "1.0"

# gRPC
prost = "0.13"
tonic = { version = "0.12", features = ["transport"] }
tonic-health = "0.12"
tonic-reflection = "0.12"

# Serde
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3"

# Primitives
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.36", features = ["serde"] }
rust_decimal_macros = "1.36"

# Errors
thiserror = "1"
anyhow = "1"

# Tracing + metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.14"
lazy_static = "1.4"

# Config
config = "0.14"
dotenvy = "0.15"

# HTTP client (egress: webhooks, profile resolution)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Crypto: receipts, mandates, JWS
ed25519-dalek = { version = "2", features = ["rand_core", "serde", "pkcs8"] }
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"

# JSON Canonicalization (JCS, RFC 8785) via the `serde_jcs` crate
serde_jcs = "0.1"

# DID / multibase decoding (did:key round-trip).
bs58 = "0.5"

# Async-method-on-trait sugar — needed for `PrincipalResolver` since
# `DidWebResolver` does HTTP I/O.
async-trait = "0.1"

# Redis (optional distributed state)
redis = { version = "0.26", features = ["tokio-comp", "connection-manager", "aio"] }

# Persistent handler state (mandates, receipts, transactions, subscriptions,
# peer quotes). Independent of the iCommerce engine's own database — this
# stores protocol-level state that must survive handler restarts. Version
# tracks the sibling iCommerce workspace for binary-size cohesion.
rusqlite = { version = "0.32.1", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# OpenAPI 3.1 schema — auto-derived from model + handler annotations so
# the machine-readable contract never drifts from the code. Swagger UI
# assets deliberately omitted; `/openapi.json` is served standalone and
# `/docs` is a tiny CDN-loading HTML page (see src/openapi.rs).
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid", "decimal"] }

# StateSet iCommerce — embedded engine of record.
# Pinned to the v1.5.0 engine release commit this handler is validated
# against; this keeps CI/Docker builds reproducible without requiring a
# sibling checkout.
stateset-embedded = { git = "https://github.com/stateset/stateset-icommerce", rev = "d5059c02a6c85aa3459afd1978dc70b275f791da", package = "stateset-embedded", version = "1.5.0", features = ["sqlite", "events"] }
stateset-core = { git = "https://github.com/stateset/stateset-icommerce", rev = "d5059c02a6c85aa3459afd1978dc70b275f791da", package = "stateset-core", version = "1.5.0" }

[build-dependencies]
tonic-build = "0.12"
chrono = "0.4"

[dev-dependencies]
tokio-stream = "0.1"
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
proptest = "1"

[features]
default = []
# Opt-in PostgreSQL backend for the embedded iCommerce engine.
postgres = []

# Release profile — same defaults as the sibling handlers for parity of
# binary size and latency characteristics.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
