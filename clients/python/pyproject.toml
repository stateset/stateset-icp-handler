[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "stateset-icp"
version = "0.2.0"
description = "Python client for StateSet ICP handlers (Intelligent Commerce Protocol)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "StateSet", email = "dom@stateset.com" }]
keywords = ["icp", "agentic-commerce", "stateset"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    "httpx>=0.27,<1.0",
    "cryptography>=42",
]

[project.urls]
Homepage = "https://github.com/stateset/stateset-icp-handler"
Specification = "https://github.com/stateset/stateset-icp-handler/blob/main/docs/specification/ICP_SPEC.md"
OpenAPI = "https://github.com/stateset/stateset-icp-handler/blob/main/docs/openapi.json"
Changelog = "https://github.com/stateset/stateset-icp-handler/blob/main/clients/python/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["stateset_icp"]
