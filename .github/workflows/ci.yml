name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  # The handler has a path-dep on the stateset-icommerce workspace, so CI
  # checks out both side-by-side under $GITHUB_WORKSPACE before invoking
  # cargo.
  build-and-test:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout handler
        uses: actions/checkout@v4
        with:
          path: stateset-icp-handler

      - name: Checkout iCommerce engine
        uses: actions/checkout@v4
        with:
          repository: stateset/stateset-icommerce
          path: stateset-icommerce
          # Pin the sibling checkout to main; bump when cutting a release.
          ref: main

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: stateset-icp-handler

      - name: cargo fmt --check
        working-directory: stateset-icp-handler
        run: cargo fmt --all --check

      - name: cargo clippy
        working-directory: stateset-icp-handler
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo build
        working-directory: stateset-icp-handler
        run: cargo build --all-targets

      - name: cargo test
        working-directory: stateset-icp-handler
        run: cargo test --all-targets

  # Verify the Dockerfile still builds from a fresh parent directory.
  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout handler
        uses: actions/checkout@v4
        with:
          path: stateset-icp-handler

      - name: Checkout iCommerce engine
        uses: actions/checkout@v4
        with:
          repository: stateset/stateset-icommerce
          path: stateset-icommerce
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: stateset-icp-handler/Dockerfile
          push: false
          tags: stateset/icp-handler:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
