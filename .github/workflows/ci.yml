name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  # The iCommerce engine crates are pinned via Git revisions in Cargo.toml,
  # so CI only needs the handler checkout.
  build-and-test:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout handler
        uses: actions/checkout@v4
        with:
          path: stateset-icp-handler

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: stateset-icp-handler

      - name: cargo fmt --check
        working-directory: stateset-icp-handler
        run: cargo fmt --all --check

      - name: cargo clippy
        working-directory: stateset-icp-handler
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo build
        working-directory: stateset-icp-handler
        run: cargo build --all-targets

      # The `postgres` feature is off by default, so the steps above never
      # compile it. Check it explicitly here so the opt-in backend can't
      # bit-rot against the pinned engine API.
      - name: cargo clippy (postgres feature)
        working-directory: stateset-icp-handler
        run: cargo clippy --all-targets --features postgres -- -D warnings

      - name: cargo test
        working-directory: stateset-icp-handler
        run: cargo test --all-targets

  # Verify the crate still builds + tests on its declared MSRV. The version
  # mirrors `rust-version` in Cargo.toml and the sibling workspace.
  msrv:
    name: msrv (1.85)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout handler
        uses: actions/checkout@v4
        with:
          path: stateset-icp-handler

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: stateset-icp-handler
          key: msrv

      - name: cargo build (MSRV)
        working-directory: stateset-icp-handler
        run: cargo build --all-targets

      - name: cargo test (MSRV)
        working-directory: stateset-icp-handler
        run: cargo test --all-targets

  # Supply-chain checks: advisories, license allowlist, banned deps, source
  # registries. Configured in deny.toml.
  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout handler
        uses: actions/checkout@v4
        with:
          path: stateset-icp-handler

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: stateset-icp-handler/Cargo.toml
          command: check
          arguments: --all-features

  # Test-suite line coverage with cargo-llvm-cov. Uploads an lcov report as
  # a build artifact and prints summary to the job log; no external coverage
  # service required.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout handler
        uses: actions/checkout@v4
        with:
          path: stateset-icp-handler

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: stateset-icp-handler
          key: coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run coverage
        working-directory: stateset-icp-handler
        run: cargo llvm-cov --all-targets --lcov --output-path lcov.info --summary-only

      - name: Upload lcov report
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: stateset-icp-handler/lcov.info
          if-no-files-found: error

  # Verify the Dockerfile still builds from a fresh handler checkout.
  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout handler
        uses: actions/checkout@v4
        with:
          path: stateset-icp-handler

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: stateset-icp-handler
          file: stateset-icp-handler/Dockerfile
          push: false
          tags: stateset/icp-handler:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
