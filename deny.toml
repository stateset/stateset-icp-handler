# cargo-deny configuration for stateset-icp-handler.
#
# Run locally with `cargo deny check` (install via `cargo install cargo-deny`).
# CI runs the same check on every PR — see .github/workflows/ci.yml.
#
# Schema: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Fail the build on any active advisory affecting the dependency graph.
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Allowlist of licenses we permit in transitive deps. Anything not on this
# list fails the check. Pure permissive + Unicode-3.0 (icu_*) + 0BSD +
# CDLA-Permissive-2.0 (webpki-roots Mozilla CA bundle) — no copyleft.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "0BSD",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The handler itself has no wildcard dependency versions; keep this true
# so local path overrides can still be checked during engine development.
allow-wildcard-paths = true
highlight = "all"
# Crates we explicitly disallow (e.g. unmaintained, license-incompatible).
deny = []
# Crates that are allowed to appear at multiple versions in the graph.
# Empty by default; add an entry only with a CHANGELOG note explaining why.
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/stateset/stateset-icommerce"]
